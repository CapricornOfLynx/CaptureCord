name: Windows
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, check licenses and smoke-test WPF
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Publish framework-dependent x64 application
        run: dotnet publish src/CaptureCord.App -c Release --no-restore -o artifacts/CaptureCord
      - name: Include distribution notices
        shell: pwsh
        run: Copy-Item LICENSE,README.md,THIRD-PARTY-NOTICES.md artifacts/CaptureCord; Copy-Item third-party artifacts/CaptureCord -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: CaptureCord-windows-x64
          path: artifacts/CaptureCord
